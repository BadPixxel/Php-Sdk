################################################################
# Defined Pipeline Stages
stages:
  - Docker
  - Quality
  - Builds

################################################################
# Functional Tests
################################################################

.core_tests:    &core_tests
    stage:      Quality
    tags:       [ Dedicated ]
    script:
        # Composer Build
        - echo "Composer => Force Grumphp from Sources"
        - composer remove  phpro/grumphp-shim --no-update --no-interaction --no-progress
        - composer require phpro/grumphp:^2.0 --no-update --no-interaction --no-progress
        - echo "Composer => Update"
        - composer update  --prefer-dist --no-interaction --no-progress
        # Execute Grump Travis Testsuite
        - cat ci/grumphp.sh | sh
    after_script:
        # Run After Script
        - cat ci/after.sh | sh

tests:php-8.4:
    image:          registry.gitlab.com/badpixxel-projects/php-sdk:php-8.4
    <<: *core_tests
    variables:
        PHP_CS_FIXER_IGNORE_ENV: 1

tests:php-8.3:
    image:          registry.gitlab.com/badpixxel-projects/php-sdk:php-8.3
    <<: *core_tests

tests:php-8.2:
    image:          registry.gitlab.com/badpixxel-projects/php-sdk:php-8.2
    <<: *core_tests

tests:php-8.1:
    image:          registry.gitlab.com/badpixxel-projects/php-sdk:php-8.1
    <<: *core_tests


################################################################
# Build Docker Images for Testing
################################################################
.docker:        &docker
  stage:        Docker
  image:        docker:stable
  tags:         [ Dedicated-Docker ]
  services:
    - docker:dind
  variables:
    IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_JOB_NAME"
  before_script:
    - docker info
  script:
    - echo "[$CI_JOB_NAME] Build & Upload Docker Image"
    ################################################################
    # Connect Docker to GitLab
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    ################################################################
    # Build & Upload Splash All Docker Images
    - docker build -t $IMAGE_TAG docker/$CI_JOB_NAME
    - docker push $IMAGE_TAG
    ################################################################
    # Connect Docker to DockerHub
    - docker login -u splashsync -p $DOCKER_HUB_TOKEN
    ################################################################
    # Build & Upload Splash All Docker Hub Images
    - docker build -t splashsync/php-sdk:$CI_JOB_NAME docker/$CI_JOB_NAME
    - docker push splashsync/php-sdk:$CI_JOB_NAME
  except:
    - schedules
  only:
    changes:
      - docker/**/*
      - .gitlab-ci.yml

php-7.2:
  <<: *docker

php-7.3:
    <<: *docker

php-7.4:
    <<: *docker

php-8.0:
    <<: *docker

php-8.1:
    <<: *docker

php-8.2:
  <<: *docker

php-8.2-apache:
  <<: *docker

php-8.3:
  <<: *docker

php-8.3-apache:
  <<: *docker

php-8.4:
  <<: *docker

php-8.4-apache:
  <<: *docker

jekyll:
    <<: *docker

jekyll-7.4:
    allow_failure:  true
    <<: *docker

#################################################################
## Build Documentation
#################################################################
pages:
    image:      jekyll/jekyll:latest
    stage:      Builds
    tags:       [ Dedicated ]
    ################################################################################
    # Run Test Script
    script:
        - wget -qO - https://gitlab.com/badpixxel-robo/jekyll/-/raw/2.0/scripts/gitlab-pages.sh | sh
    ################################################################################
    # Only on Default Branch
    rules:
        - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    artifacts:
        paths:
          - public

